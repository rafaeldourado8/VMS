# ============================================
# VOLUMES
# ============================================
volumes:
  gtvision_pg_data:
  backend_static:
  backend_media:
  mediamtx_recordings:
  clips_storage:

# ============================================
# NETWORK
# ============================================
networks:
  gtvision_network:
    driver: bridge
