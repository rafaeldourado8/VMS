  #       condition: service_healthy
  #     streaming:
  #       condition: service_healthy
  #   networks:
  #     - gtvision_network
  #   restart: unless-stopped


  # ============================================
  # SERVIÇO DE IA - WORKER 2 (DESABILITADO)
  # ============================================
