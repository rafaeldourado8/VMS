

services:
  # ============================================
  # ONVIF PLAYBACK SERVICE
  # ============================================
  onvif:
    build:
      context: ./services/onvif
      dockerfile: Dockerfile
    container_name: gtvision_onvif
    command: uvicorn main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # STORAGE SERVICE (Indexador de Gravações)
  # ============================================
  storage:
    build:
      context: ./services/storage
      dockerfile: Dockerfile
    image: gtvision/storage:latest
    container_name: gtvision_storage
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      POSTGRES_HOST: postgres_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./recordings:/recordings:ro
    ports:
      - "8003:8003"
    depends_on:
      postgres_db:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # LPR OFFLINE WORKER (Processa vídeos gravados)
  # ============================================
  # lpr_offline:
  #   build:
  #     context: ./services/lpr
  #     dockerfile: Dockerfile
  #   image: gtvision/lpr:latest
  #   container_name: gtvision_lpr_offline
  #   command: python lpr_offline_worker.py
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '2.0'
  #         memory: 4G
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: all
  #     NVIDIA_DRIVER_CAPABILITIES: compute,utility
  #     STORAGE_API_URL: http://storage:8003
  #     POSTGRES_HOST: postgres_db
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   volumes:
  #     - mediamtx_recordings:/recordings:ro
  #     - ./services/lpr/weights:/app/weights:ro
  #   depends_on:
  #     storage:
  #       condition: service_healthy
  #     postgres_db:
  #       condition: service_healthy
  #   networks:
  #     - gtvision_network
  #   restart: unless-stopped

  # ============================================
  # STREAMING SERVICE (FastAPI)
  # ============================================
  streaming:
    build:
      context: ./services/streaming
      dockerfile: Dockerfile
    image: gtvision/streaming:latest
    container_name: gtvision_streaming
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    environment:
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      MEDIAMTX_WEBRTC_URL: http://mediamtx:8889
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER:-mediamtx_api_user}
      MEDIAMTX_API_PASS: ${MEDIAMTX_API_PASS}
      REDIS_URL: redis://redis_cache:6379/2
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    depends_on:
      mediamtx:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # AUTO PROVISION LOOP
  # ============================================
  auto_provision:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: gtvision/backend:latest
    container_name: gtvision_auto_provision
    command: python auto_provision_loop.py
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    env_file: .env
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
    depends_on:
      backend:
        condition: service_healthy
      streaming:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped

  # ============================================
  # BACKEND (Django API)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: gtvision_backend
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - ./recordings:/recordings:ro
      - clips_storage:/clips
    env_file: .env
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      REDIS_HOST: redis_cache
      STREAMING_API_URL: http://streaming:8001
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      streaming:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin/login/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ============================================
  # CLIPS WORKER (Processa clips pendentes)
  # ============================================
  clips_worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: gtvision_clips_worker
    command: sh -c "python wait_for_db.py && python manage.py migrate --noinput && python manage.py process_clips"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    volumes:
      - clips_storage:/clips
    env_file: .env
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
    depends_on:
      backend:
        condition: service_healthy
      clips:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped

  # ============================================
  # BACKEND WORKER (Celery) - DESABILITADO
  # ============================================
  # backend_worker:
  #   build:
  #     context: .
  #     dockerfile: ./backend/Dockerfile
  #   container_name: gtvision_backend_worker
  #   command: sh -c "python wait_for_db.py && celery -A config worker --loglevel=info"
  #   env_file: .env
  #   environment:
  #     CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   networks:
  #     - gtvision_network
  #   restart: unless-stopped

  # ============================================
  # FRONTEND (Vite / React)
  # ============================================
  frontend:
    image: node:20-slim
    container_name: gtvision_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - gtvision_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ============================================
  # KONG API GATEWAY (via HAProxy)
  # ============================================
  kong:
    image: kong:3.5
    container_name: gtvision_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      backend:
        condition: service_healthy
      streaming:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # HAPROXY
  # ============================================
  haproxy:
    image: haproxy:2.9-alpine
    container_name: gtvision_haproxy
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"
    environment:
      HAPROXY_STATS_USER: ${HAPROXY_STATS_USER}
      HAPROXY_STATS_PASSWORD: ${HAPROXY_STATS_PASSWORD}
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro
    depends_on:
      kong:
        condition: service_started
      streaming:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - gtvision_network
    restart: unless-stopped

  # ============================================
  # NGINX (STATIC)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: gtvision_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
      - ./recordings:/recordings:ro
    networks:
      - gtvision_network

  # ============================================
  # POSTGRES PRIMARY (SINGLE INSTANCE)
  # ============================================
  postgres_db:
    image: postgres:15-alpine
    container_name: gtvision_postgres_primary
    env_file: .env
    volumes:
      - gtvision_pg_data:/var/lib/postgresql/data
    networks:
      - gtvision_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # REDIS
  # ============================================
  redis_cache:
    image: redis:7-alpine
    container_name: gtvision_redis
    networks:
      - gtvision_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MEDIAMTX
  # ============================================
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: gtvision_mediamtx
    environment:
      TZ: America/Sao_Paulo
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER}
      MEDIAMTX_API_PASS: ${MEDIAMTX_API_PASS}
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9996:9996"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    networks:
      - gtvision_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9997/v3/config/global/get"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================
  # RECORDER (Gravação otimizada)
  # ============================================
  recorder:
    build:
      context: ./services/recorder
      dockerfile: Dockerfile
    container_name: gtvision_recorder
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ./recordings:/recordings
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped

  # ============================================
  # RETENTION CLEANUP (Limpeza automática)
  # ============================================
  retention_cleanup:
    build:
      context: ./services/recorder
      dockerfile: Dockerfile
    container_name: gtvision_retention_cleanup
    command: python retention_cleanup.py
    environment:
      TZ: America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    volumes:
      - ./recordings:/recordings
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped

  # ============================================
  # CLEANUP ORPHAN RECORDINGS
  # ============================================
  cleanup_orphan:
    build:
      context: ./services/recorder
      dockerfile: Dockerfile
    container_name: gtvision_cleanup_orphan
    command: python cleanup_orphan_recordings.py
    environment:
      TZ: America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    volumes:
      - ./recordings:/recordings
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped

  # ============================================
  # VOD HLS SERVICE (Converte MP4 para HLS)
  # ============================================
  vod_hls:
    build:
      context: ./services/vod
      dockerfile: Dockerfile
    container_name: gtvision_vod_hls
    ports:
      - "8006:8004"
    volumes:
      - ./recordings:/recordings:ro
      - ./hls_cache:/hls_cache
    environment:
      - RECORDINGS_DIR=/recordings
      - HLS_CACHE_DIR=/hls_cache
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - gtvision_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # CLIPS SERVICE
  # ============================================
  clips:
    build:
      context: ./services/clips
      dockerfile: Dockerfile
    container_name: gtvision_clips
    ports:
      - "8004:8004"
    volumes:
      - ./recordings:/recordings:ro
      - clips_storage:/clips
    depends_on:
      mediamtx:
        condition: service_healthy
    networks:
      - gtvision_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

