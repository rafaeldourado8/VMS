worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    gzip on;
    gzip_types text/css application/javascript application/json;

    server {
        listen 80;
        
        # Servir estáticos do Django (CSS, JS do Admin)
        location /static/ {
            alias /var/www/static/;
            expires 7d;
            access_log off;
        }
        
        # Servir media (Uploads, Imagens)
        location /media/ {
            alias /var/www/media/;
            expires 7d;
            access_log off;
        }
        
        # Servir gravações MP4 diretamente (otimizado para reduzir requests visíveis)
        location /recordings/ {
            alias /recordings/;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Range" always;
            
            # Cache agressivo (1 hora) para reduzir re-downloads
            add_header Cache-Control "public, max-age=3600, immutable";
            add_header Accept-Ranges bytes;
            
            # Suporte para streaming de vídeo
            mp4;
            mp4_buffer_size 4m;
            mp4_max_buffer_size 20m;
            
            # Otimizações para reduzir latência
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            
            # Desabilitar logs de acesso para reduzir overhead
            access_log off;
            
            # Compressão para metadados MP4
            gzip off;  # Não comprimir vídeo
        }
    }
}