worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    gzip on;
    gzip_types text/css application/javascript application/json;

    server {
        listen 80;
        
        # Servir estáticos do Django (CSS, JS do Admin)
        location /static/ {
            alias /var/www/static/;
            expires 7d;
            access_log off;
        }
        
        # Servir media (Uploads, Imagens)
        location /media/ {
            alias /var/www/media/;
            expires 7d;
            access_log off;
        }
        
        # Servir gravações MP4 diretamente (SEM AUTENTICAÇÃO - TEMPORÁRIO)
        location ~ ^/recordings/camera_(\d+)/([0-9-]+)/([0-9-]+)\.mp4$ {
            alias /recordings/camera_$1/$2/$3.mp4;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Range" always;
            add_header Cache-Control "public, max-age=3600";
            add_header Accept-Ranges bytes;
        }
    }
}