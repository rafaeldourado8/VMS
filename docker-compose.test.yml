version: '3.8'

services:
  postgres_test:
    image: postgres:15
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEBUG: "True"
      DB_HOST: postgres_test
      DB_PORT: 5432
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      REDIS_HOST: redis_test
      REDIS_PORT: 6379
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
    ports:
      - "8001:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py test"
