_format_version: "3.0"

services:
  - name: backend-api
    url: http://backend:8000
    routes:
      - name: api-route
        paths:
          - /api
        strip_path: false
      - name: admin-route
        paths:
          - /admin
        strip_path: false
    plugins:
      # CORS
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Requested-With
          credentials: true
          max_age: 3600
      
      # Rate Limiting - 1000 req/min por IP
      - name: rate-limiting
        config:
          minute: 1000
          policy: local
      
      # Request Size Limiting - 10MB
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
      
      # Security Headers
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Content-Type-Options:nosniff"
              - "X-Frame-Options:DENY"
              - "X-XSS-Protection:1; mode=block"
              - "Strict-Transport-Security:max-age=31536000"
