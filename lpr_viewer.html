<!DOCTYPE html>
<html>
<head>
    <title>LPR Stream Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00ff00;
        }
        #video {
            width: 100%;
            max-width: 1280px;
            background: black;
            display: block;
            margin: 20px auto;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #00ff00;
            border: none;
            cursor: pointer;
            margin: 0 5px;
        }
        button:hover {
            background: #00cc00;
        }
        .info {
            text-align: center;
            margin: 10px 0;
            color: #888;
        }
        .legend {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .legend h3 {
            margin-top: 0;
            color: #00ff00;
        }
        .color-box {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 LPR Stream Viewer</h1>
        
        <div class="controls">
            <input type="number" id="cameraId" placeholder="Camera ID (ex: 700)" value="700">
            <button onclick="loadStream()">Carregar Stream</button>
            <button onclick="stopStream()">Parar</button>
        </div>
        
        <div class="info" id="status">Digite o ID da câmera e clique em Carregar Stream</div>
        
        <video id="video" controls autoplay muted></video>
        
        <div class="legend">
            <h3>📊 Legenda</h3>
            <p><span class="color-box" style="background: red;"></span> <strong>NEW</strong> - Placa detectada pela primeira vez</p>
            <p><span class="color-box" style="background: yellow;"></span> <strong>TRACKING</strong> - Placa sendo rastreada (aguardando estabilidade)</p>
            <p><span class="color-box" style="background: lime;"></span> <strong>SAVED</strong> - Placa já foi salva (snapshot criado)</p>
            <p><span class="color-box" style="background: cyan;"></span> <strong>ROI</strong> - Região de interesse (área com movimento)</p>
        </div>
    </div>

    <script>
        let hls = null;
        
        function loadStream() {
            const cameraId = document.getElementById('cameraId').value;
            if (!cameraId) {
                alert('Digite o ID da câmera!');
                return;
            }
            
            const video = document.getElementById('video');
            const streamUrl = `http://localhost:8888/cam_${cameraId}_ai/index.m3u8`;
            
            document.getElementById('status').textContent = `Carregando stream da câmera ${cameraId}...`;
            
            if (hls) {
                hls.destroy();
            }
            
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });
                
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                    document.getElementById('status').textContent = `✅ Stream da câmera ${cameraId} carregado!`;
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        document.getElementById('status').textContent = `❌ Erro: ${data.type} - Verifique se a câmera ${cameraId} está ativa`;
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                    document.getElementById('status').textContent = `✅ Stream da câmera ${cameraId} carregado!`;
                });
            }
        }
        
        function stopStream() {
            const video = document.getElementById('video');
            video.pause();
            if (hls) {
                hls.destroy();
                hls = null;
            }
            document.getElementById('status').textContent = 'Stream parado';
        }
    </script>
</body>
</html>
