global
    log stdout format raw local0 info
    maxconn 8192
    # Em Docker, NÃO usar daemon (processo deve ficar em foreground)
    # daemon

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 10s
    timeout client  60s
    timeout server  60s
    timeout tunnel  1h
    # Evitar alertas durante inicialização
    default-server inter 10s fastinter 2s downinter 5s rise 2 fall 5

frontend main
    bind *:80
    mode http

    # =====================================================
    # IMPORTANTE: A ORDEM DAS ACLs E USE_BACKEND IMPORTA!
    # Regras mais específicas devem vir ANTES das genéricas
    # =====================================================

    # 0. Clips Service (PRIMEIRO DE TUDO - mais específico que /api/)
    acl is_clips_service path_beg /api/clips-service/
    acl is_clips_list path /api/clips-service

    # 1. Frontend Vite (DEV – mais específico)
    acl is_vite_internal path_beg /@vite/ /@fs/ /@react-refresh
    acl is_src_files     path_beg /src/ /node_modules/
    acl is_vite_hmr      path_beg /__vite_ping
    acl is_vite_ws_path  path_reg ^/\?token=

    # 2. MediaMTX (ANTES do Streaming Service)
    acl is_hls            path_beg /hls/
    acl is_playback       path_beg /playback/
    acl is_webrtc_direct  path_beg /webrtc/
    acl is_cam_stream     path_beg /cam_
    acl is_streaming_hls  path_beg /streaming/hls/
    acl is_vod_hls        path_beg /vod/

    # 3. Streaming Service
    acl is_streaming_api path_beg /streaming/
    acl is_streaming_ws  path_beg /ws/events/ /ws/dashboard
    
    # 3.5. Storage Service
    acl is_storage_api path_beg /storage/
    
    # 3.6. Recordings - Servir diretamente via Nginx
    acl is_recordings path_beg /recordings/

    # 4. Django/Admin via Kong (DEPOIS do clips-service)
    acl is_admin path_beg /admin/
    acl is_api   path_beg /api/

    # 5. Estáticos via Nginx
    acl is_static path_beg /static/ /media/

    # =====================================================
    # ROTEAMENTO
    # =====================================================

    # Clips (ANTES de /api/ genérico)
    use_backend clips_service if is_clips_list
    use_backend clips_service if is_clips_service

    # Frontend Vite
    use_backend frontend_dev if is_vite_internal
    use_backend frontend_dev if is_src_files
    use_backend frontend_dev if is_vite_hmr
    use_backend frontend_dev if is_vite_ws_path

    # MediaMTX (PRIMEIRO)
    use_backend mediamtx_hls if is_hls
    use_backend mediamtx_playback if is_playback
    use_backend mediamtx_hls if is_cam_stream
    use_backend mediamtx_hls_legacy if is_streaming_hls
    use_backend mediamtx_webrtc if is_webrtc_direct
    use_backend vod_hls_service if is_vod_hls

    # Streaming
    use_backend streaming_service if is_streaming_api
    use_backend streaming_service if is_streaming_ws
    
    # Storage
    use_backend storage_service if is_storage_api
    
    # Recordings via Nginx
    use_backend nginx_recordings if is_recordings

    # Django / Kong
    use_backend kong_gateway if is_admin
    use_backend kong_gateway if is_api

    # Estáticos
    use_backend nginx_static if is_static

    # Default → Frontend
    default_backend frontend_dev

# =====================================================
# BACKENDS
# =====================================================

backend streaming_service
    mode http
    http-request replace-path /streaming/(.*) /\1
    option httpchk GET /health
    http-check expect status 200
    server streaming1 streaming:8001 check

backend storage_service
    mode http
    http-request replace-path /storage/(.*) /\1
    option httpchk GET /health
    http-check expect status 200
    server storage1 storage:8003 check

backend mediamtx_hls
    mode http
    http-request replace-path /hls/(.*) /\1
    server mediamtx1 mediamtx:8888 check

backend mediamtx_playback
    mode http
    server mediamtx1 mediamtx:9996

backend mediamtx_hls_legacy
    mode http
    http-request replace-path /streaming/hls/cam_([0-9]+)/(.*) /cam_\1/\2
    server mediamtx1 mediamtx:8888 check

backend mediamtx_webrtc
    mode http
    stick-table type ip size 100k expire 30m
    stick on src
    server mediamtx1 mediamtx:8889 check

backend vod_hls_service
    mode http
    server vod_hls1 vod_hls:8004 check

backend kong_gateway
    mode http
    option httpchk GET /
    http-check expect status 200,404
    server kong1 kong:8000 check

backend nginx_static
    mode http
    server nginx1 nginx:80 check

backend nginx_recordings
    mode http
    # Suporte completo para streaming de vídeo
    http-request set-header X-Forwarded-For %[src]
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Range, Authorization"
    timeout server 300s
    server nginx1 nginx:80 check

backend clips_service
    mode http
    http-request replace-path /api/clips-service/?$ /clips
    http-request replace-path /api/clips-service/(.*) /clips/\1
    # Suporte para streaming de vídeo (Range requests)
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Range, Authorization, Content-Type"
    http-response set-header Accept-Ranges "bytes"
    timeout server 300s
    option httpchk GET /health
    http-check expect status 200
    server clips1 clips:8004 check

# ❗ FRONTEND DEV (Vite)
backend frontend_dev
    mode http
    # Healthcheck mais tolerante para dev
    option httpchk GET /
    http-check expect status 200,403,404
    # Aumentar timeouts para dev
    timeout server 120s
    timeout connect 30s
    # Retry mais agressivo
    default-server inter 5s fastinter 2s downinter 3s rise 2 fall 3
    server frontend1 frontend:5173 check

# =====================================================
# STATS
# =====================================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s


